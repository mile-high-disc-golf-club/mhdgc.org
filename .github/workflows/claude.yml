name: Claude

# Runs when a comment mentioning @claude is posted on a PR or issue,
# e.g. "@claude review this PR".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only members of the club's GitHub organization can summon Claude, so
    # strangers can't spend the token. On an organization's repo, its members
    # show as MEMBER (OWNER only appears on repos a person owns).
    if: |
      (contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude')) ||
      (contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association) && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the action trades this for a Claude GitHub App token
      actions: read # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The action edits its "Claude Code is working…" comment in place with the
      # result. An edit doesn't notify anything watching for new comments, such as
      # the Claude desktop app's Auto-fix, so post a new comment pointing to it.
      # GITHUB_TOKEN's comments don't trigger workflows, so this can't start a run.
      - name: Comment that Claude has finished
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reply=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .html_url' | tail -n 1)
          if [ "$OUTCOME" = success ] && [ -n "$reply" ]; then
            body="Claude has finished: [read its reply]($reply)."
          else
            body="Claude's run didn't finish: [see the job log]($RUN_URL)."
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
