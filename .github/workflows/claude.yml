name: Claude

# Runs when a comment mentioning @claude is posted on a PR or issue,
# e.g. "@claude review this PR".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only members of the club's GitHub organization can summon Claude, so
    # strangers can't spend the token. On an organization's repo, its members
    # show as MEMBER (OWNER only appears on repos a person owns).
    if: |
      (contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@claude')) ||
      (contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association) && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the action trades this for a Claude GitHub App token
      actions: read # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
